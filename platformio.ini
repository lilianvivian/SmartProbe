[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Serial Monitor Options
monitor_speed = 115200

; Match only real USB serial devices. Left to auto-detect, PlatformIO picks the
; first port it finds - on this machine that is a Bluetooth speaker, and avrdude
; then spends ten attempts failing to sync with it. The glob covers usbmodem
; (genuine Uno), wchusbserial (CH340 clones) and usbserial (FTDI/CP2102), while
; excluding every Bluetooth and macOS internal port.
; Pinned to the Uno (VID:PID 2341:0043) so uploads never land on the ESP32.
; Genuine Arduinos are named by physical port, not serial number, so this path
; changes if you move the cable: usbmodem101 on one port, usbmodem1101 on the
; other. Keep the Uno in one port, or update this line if you move it.
upload_port  = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101

; Arduino reserves 64 B for each Serial buffer by default - 128 B of a 2 KB
; part. This sketch only ever receives single-byte commands, and a smaller TX
; buffer just makes Serial.print block a little longer.
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=16
    -D SERIAL_TX_BUFFER_SIZE=32

; Library Dependencies
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.2
    bblanchon/ArduinoJson @ ^7.0.0
    feilipu/FreeRTOS @ ^11.1.0-2 