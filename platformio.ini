; =============================================================================
; SmartProbe — both boards in one project.
;
; The LoRa wire format lives in include/protocol.h, which BOTH environments
; compile against, so the two ends can no longer drift apart. Each board's own
; pin map sits beside its main.cpp in src/<board>/ and is found by the compiler
; searching the including file's directory first.
;
;   pio run                        build both
;   pio run -e ground_station -t upload
;   pio run -e node -t upload
; =============================================================================

[env:ground_station]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<ground_station/>

monitor_speed = 115200

; Matches the Uno in either USB port without matching the ESP32. Genuine
; Arduinos are named by physical port (usbmodem101 / usbmodem1101), so a fixed
; name breaks whenever the cable moves. The ESP32's CH343 is named from its
; serial number (usbmodem5C371790821) — the all-digit prefix below excludes it,
; since 'C' is not in [0-9]. Bluetooth ports are excluded too.
upload_port  = /dev/cu.usbmodem[0-9][0-9][0-9]*
monitor_port = /dev/cu.usbmodem[0-9][0-9][0-9]*

; SRAM trims for a 2 KB part.
;  - Serial: Arduino reserves 64 B per buffer; this sketch only ever receives
;    single-byte commands, and a smaller TX buffer just makes print() block
;    slightly longer.
;  - TWI: three 32 B driver buffers serve a 16x2 LCD that sends a byte at a
;    time. (TwoWire's own two 32 B buffers can't be trimmed the same way —
;    Wire.h defines BUFFER_LENGTH unconditionally, so -D is a no-op there.)
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=16
    -D SERIAL_TX_BUFFER_SIZE=32
    -D TWI_BUFFER_LENGTH=16

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.2


[env:node]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_src_filter = +<node/>

monitor_speed = 115200

; Pinned to this board's CH343 bridge (VID:PID 1A86:55D3). macOS derives the
; name from the chip's serial number, so it holds whichever physical port the
; cable goes into — unlike the Uno, which is named by location.
upload_port  = /dev/cu.usbmodem5C37179082*
monitor_port = /dev/cu.usbmodem5C37179082*

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    eloquentarduino/EloquentTensorFlow32 @ ^1.0.0
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    sandeepmistry/LoRa @ ^0.8.0
    arduino-libraries/WiFi@^1.2.7

lib_ignore =
    WebServer
    AsyncTCP
    ESPAsyncWebServer
