[env:uno]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 115200

; Matches the Uno in either USB port without matching the ESP32.
; Genuine Arduinos are named by physical port (usbmodem101 / usbmodem1101), so a
; fixed name breaks whenever the cable moves. The ESP32's CH343 is named from its
; serial number (usbmodem5C371790821) - the all-digit prefix below excludes it,
; since 'C' is not in [0-9]. Bluetooth ports are excluded too.
upload_port  = /dev/cu.usbmodem[0-9][0-9][0-9]*
monitor_port = /dev/cu.usbmodem[0-9][0-9][0-9]*

; SRAM trims for a 2 KB part.
;  - Serial: Arduino reserves 64 B per buffer. This sketch only ever receives
;    single-byte commands, and a smaller TX buffer just makes print() block
;    slightly longer.
;  - TWI: three 32 B driver buffers serve a 16x2 LCD that sends a byte at a
;    time. (TwoWire's own two 32 B buffers can't be trimmed the same way -
;    Wire.h defines BUFFER_LENGTH unconditionally, so -D is a no-op there.)
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=16
    -D SERIAL_TX_BUFFER_SIZE=32
    -D TWI_BUFFER_LENGTH=16

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.2
