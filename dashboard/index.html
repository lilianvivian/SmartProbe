<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartProbe — Live Dashboard</title>

<!-- MQTT over WebSockets client -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
  :root {
    color-scheme: light;
    --plane:        #f9f9f7;
    --surface:      #fcfcfb;
    --ink:          #0b0b0b;
    --ink-2:        #52514e;
    --muted:        #898781;
    --grid:         #e1e0d9;
    --baseline:     #c3c2b7;
    --border:       rgba(11,11,11,0.10);

    /* categorical series (validated slots 1-3) */
    --temp:  #2a78d6;   /* blue   */
    --hum:   #eb6834;   /* orange */
    --voc:   #1baf7a;   /* aqua   */
    --pres:  #4a3aa7;   /* violet */

    /* status palette (fixed, never themed) */
    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane:    #0d0d0d;
      --surface:  #1a1a19;
      --ink:      #ffffff;
      --ink-2:    #c3c2b7;
      --muted:    #898781;
      --grid:     #2c2c2a;
      --baseline: #383835;
      --border:   rgba(255,255,255,0.10);
      --temp: #3987e5;
      --hum:  #d95926;
      --voc:  #199e70;
      --pres: #9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7;
    --muted:#898781; --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --temp:#3987e5; --hum:#d95926; --voc:#199e70; --pres:#9085e9;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.4;
    padding: 20px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  header {
    display: flex; flex-wrap: wrap; gap: 12px 20px;
    align-items: baseline; justify-content: space-between;
    margin-bottom: 4px;
  }
  h1 { font-size: 1.35rem; margin: 0; font-weight: 650; }
  h1 .probe { color: var(--ink-2); font-weight: 500; }
  .updated { color: var(--muted); font-size: 0.85rem; }

  /* connection bar */
  .conn {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin: 14px 0 18px;
    font-size: 0.85rem;
  }
  .conn input {
    font: inherit; padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--plane); color: var(--ink);
  }
  .conn input#broker { flex: 1 1 260px; }
  .conn input#topic  { flex: 1 1 180px; }
  .conn button {
    font: inherit; padding: 6px 14px; border: 0; border-radius: 6px;
    background: var(--temp); color: #fff; cursor: pointer; font-weight: 600;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on  { background: var(--good); }
  .dot.off { background: var(--critical); }

  /* status banner */
  .banner {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    border: 1px solid var(--border); border-left: 6px solid var(--muted);
    background: var(--surface); border-radius: 12px;
    padding: 16px 20px; margin-bottom: 18px;
  }
  .banner.safe     { border-left-color: var(--good); }
  .banner.warning  { border-left-color: var(--warning); }
  .banner.critical { border-left-color: var(--critical); }
  .banner .icon { font-size: 1.6rem; line-height: 1; }
  .banner .state { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.01em; }
  .banner.safe .state     { color: var(--good); }
  .banner.warning .state  { color: var(--warning); }
  .banner.critical .state { color: var(--critical); }
  .banner .detail { color: var(--ink-2); font-size: 0.95rem; }
  .banner .rec { margin-left: auto; font-weight: 600; }

  /* stat tiles */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }

  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .tile .label { color: var(--ink-2); font-size: 0.8rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .value { font-size: 2rem; font-weight: 650; margin-top: 2px; }
  .tile .value .unit { font-size: 0.95rem; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .tile .sub { color: var(--muted); font-size: 0.8rem; min-height: 1em; }
  .spark { display: block; width: 100%; height: 40px; margin-top: 8px; overflow: visible; }
  .spark .hoverval { fill: var(--ink); font-size: 11px; font-weight: 600; }

  /* AI / meta row */
  .meta {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 14px;
  }
  @media (max-width: 720px) { .meta { grid-template-columns: repeat(2, 1fr); } }
  .meta .tile .value { font-size: 1.25rem; }

  .foot { color: var(--muted); font-size: 0.8rem; margin-top: 22px; text-align: center; }
  .foot code { background: var(--surface); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }

  @keyframes flash { 0%,100% { background: var(--surface); } 50% { background: rgba(208,59,59,0.14); } }
  body.alarm { animation: flash 1s ease-in-out 3; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SmartProbe <span class="probe" id="probeId">—</span></h1>
    <div class="updated" id="updated">waiting for data…</div>
  </header>

  <div class="conn">
    <span class="dot" id="connDot"></span>
    <label>Broker (WS):</label>
    <input id="broker" value="ws://broker.hivemq.com:8000/mqtt" spellcheck="false" />
    <label>Topic:</label>
    <input id="topic" value="smartprobe/+/telemetry" spellcheck="false" />
    <button id="connectBtn">Connect</button>
    <span id="connMsg" style="color:var(--muted)"></span>
  </div>

  <div class="banner" id="banner">
    <span class="icon" id="statusIcon">•</span>
    <span class="state" id="statusText">NO DATA</span>
    <span class="detail" id="statusCause"></span>
    <span class="rec" id="statusRec"></span>
  </div>

  <div class="grid">
    <div class="tile">
      <div class="label">Temperature</div>
      <div class="value"><span id="tempVal">—</span><span class="unit">°C</span></div>
      <div class="sub" id="tempSub"></div>
      <svg class="spark" id="tempSpark" preserveAspectRatio="none"></svg>
    </div>
    <div class="tile">
      <div class="label">Humidity</div>
      <div class="value"><span id="humVal">—</span><span class="unit">%</span></div>
      <div class="sub" id="humSub"></div>
      <svg class="spark" id="humSpark" preserveAspectRatio="none"></svg>
    </div>
    <div class="tile">
      <div class="label">VOC / Gas</div>
      <div class="value"><span id="vocVal">—</span><span class="unit" id="gasUnit"></span></div>
      <div class="sub" id="vocSub"></div>
      <svg class="spark" id="vocSpark" preserveAspectRatio="none"></svg>
    </div>
    <div class="tile">
      <div class="label">Pressure</div>
      <div class="value"><span id="presVal">—</span><span class="unit">hPa</span></div>
      <div class="sub" id="presSub"></div>
      <svg class="spark" id="presSpark" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="meta">
    <div class="tile"><div class="label">AI Trend</div><div class="value" id="trendVal">—</div></div>
    <div class="tile"><div class="label">Next Inspection</div><div class="value" id="nextVal">—</div></div>
    <div class="tile"><div class="label">Confidence</div><div class="value" id="confVal">—</div></div>
    <div class="tile"><div class="label">Mode / Actuators</div><div class="value" id="modeVal" style="font-size:1rem">—</div></div>
  </div>

  <div class="foot">
    Live view — history is held in the browser only. Publishing topic
    <code>smartprobe/&lt;id&gt;/telemetry</code>. Refresh clears the chart.
  </div>
</div>

<script>
"use strict";

// ---- rolling history (per metric), newest last ----
const MAX_POINTS = 40;
const series = {
  temp: [], hum: [], voc: [], pres: []
};

const $ = (id) => document.getElementById(id);

const seriesColor = {
  temp: "--temp", hum: "--hum", voc: "--voc", pres: "--pres"
};

// ---- sparkline rendering (each auto-scales to its own range) ----
function drawSpark(svgId, key) {
  const svg = $(svgId);
  const data = series[key];
  const w = svg.clientWidth || 200;
  const h = svg.clientHeight || 40;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (data.length < 2) return;

  let min = Math.min(...data), max = Math.max(...data);
  if (min === max) { min -= 1; max += 1; }        // flat line -> centered band
  const pad = 4;
  const x = (i) => pad + (i / (data.length - 1)) * (w - 2 * pad);
  const y = (v) => (h - pad) - ((v - min) / (max - min)) * (h - 2 * pad);

  const color = getComputedStyle(document.documentElement)
                  .getPropertyValue(seriesColor[key]).trim();

  const pts = data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  line.setAttribute("points", pts);
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width", "2");
  line.setAttribute("stroke-linecap", "round");
  line.setAttribute("stroke-linejoin", "round");
  svg.appendChild(line);

  // rounded data-end dot on the latest point
  const last = data.length - 1;
  const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  dot.setAttribute("cx", x(last).toFixed(1));
  dot.setAttribute("cy", y(data[last]).toFixed(1));
  dot.setAttribute("r", "2.6");
  dot.setAttribute("fill", color);
  svg.appendChild(dot);

  // lightweight hover: crosshair dot + value readout
  const hoverDot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  hoverDot.setAttribute("r", "3"); hoverDot.setAttribute("fill", color);
  hoverDot.style.display = "none";
  const hoverTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
  hoverTxt.setAttribute("class", "hoverval"); hoverTxt.style.display = "none";
  svg.appendChild(hoverDot); svg.appendChild(hoverTxt);

  svg.onmousemove = (e) => {
    const rect = svg.getBoundingClientRect();
    const rel = (e.clientX - rect.left) / rect.width * w;
    let i = Math.round((rel - pad) / (w - 2 * pad) * (data.length - 1));
    i = Math.max(0, Math.min(data.length - 1, i));
    hoverDot.setAttribute("cx", x(i).toFixed(1));
    hoverDot.setAttribute("cy", y(data[i]).toFixed(1));
    hoverDot.style.display = "";
    hoverTxt.textContent = (Math.round(data[i] * 10) / 10).toString();
    hoverTxt.setAttribute("x", Math.min(w - 24, x(i) + 4).toFixed(1));
    hoverTxt.setAttribute("y", Math.max(11, y(data[i]) - 5).toFixed(1));
    hoverTxt.style.display = "";
  };
  svg.onmouseleave = () => { hoverDot.style.display = "none"; hoverTxt.style.display = "none"; };
}

function redrawAll() {
  drawSpark("tempSpark", "temp");
  drawSpark("humSpark", "hum");
  drawSpark("vocSpark", "voc");
  drawSpark("presSpark", "pres");
}
window.addEventListener("resize", redrawAll);

// ---- apply one telemetry message to the UI ----
const STATUS = {
  SAFE:     { cls: "safe",     icon: "✓", },
  WARNING:  { cls: "warning",  icon: "⚠", },
  CRITICAL: { cls: "critical", icon: "✕", }
};

function push(key, v) {
  const arr = series[key];
  arr.push(v);
  if (arr.length > MAX_POINTS) arr.shift();
}

function num(v, digits) {
  return (typeof v === "number" && isFinite(v))
    ? v.toFixed(digits) : "—";
}

function applyReport(r) {
  if (r.id) $("probeId").textContent = r.id;
  $("updated").textContent = "updated " + new Date().toLocaleTimeString();

  // tiles
  $("tempVal").textContent = num(r.temperature, 1);
  $("humVal").textContent  = num(r.humidity, 0);
  $("vocVal").textContent  = num(r.voc, 0);
  $("presVal").textContent = num(r.pressure, 1);
  $("gasUnit").textContent = r.gas ? r.gas : "";
  $("vocSub").textContent  = r.gas ? ("gas level: " + r.gas) : "";

  if (typeof r.temperature === "number") push("temp", r.temperature);
  if (typeof r.humidity === "number")    push("hum",  r.humidity);
  if (typeof r.voc === "number")         push("voc",  r.voc);
  if (typeof r.pressure === "number")    push("pres", r.pressure);
  redrawAll();

  // status banner (icon + label + color — never color alone)
  const banner = $("banner");
  const s = STATUS[r.status] || { cls: "", icon: "•" };
  banner.className = "banner " + s.cls;
  $("statusIcon").textContent = s.icon;
  $("statusText").textContent = r.status || "—";
  $("statusCause").textContent = (r.cause && r.cause !== "NONE") ? ("Cause: " + r.cause) : "";
  $("statusRec").textContent = r.recommendation || "";

  // meta row
  $("trendVal").textContent = r.trend || "—";
  $("nextVal").textContent  = (r.nextInspectionDays != null) ? (r.nextInspectionDays + " days") : "—";
  $("confVal").textContent  = (typeof r.confidence === "number")
    ? Math.round(r.confidence * 100) + "%" : "—";
  $("modeVal").textContent =
    (r.mode || "—") +
    (r.runFan ? " · fan ON" : " · fan off") +
    (r.soundAlarm ? " · ALARM" : "");

  // critical -> flash + tone (driven purely by the MQTT status field)
  if (r.status === "CRITICAL") criticalAlert();
}

let lastAlert = 0;
function criticalAlert() {
  const now = Date.now();
  if (now - lastAlert < 15000) return;   // debounce
  lastAlert = now;
  document.body.classList.remove("alarm");
  void document.body.offsetWidth;        // restart animation
  document.body.classList.add("alarm");
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.05, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime + 0.25);
  } catch (e) { /* audio may be blocked before user interaction */ }
}

// ---- MQTT connection ----
let client = null;
function setConn(state, msg) {
  const dot = $("connDot");
  dot.className = "dot " + (state === "on" ? "on" : state === "off" ? "off" : "");
  $("connMsg").textContent = msg || "";
}

function connect() {
  const url = $("broker").value.trim();
  const topic = $("topic").value.trim();
  if (client) { try { client.end(true); } catch (e) {} }

  setConn("", "connecting…");
  client = mqtt.connect(url, { connectTimeout: 8000, reconnectPeriod: 4000 });

  client.on("connect", () => {
    setConn("on", "connected");
    client.subscribe(topic, (err) => {
      if (err) setConn("off", "subscribe failed: " + err.message);
    });
  });
  client.on("reconnect", () => setConn("", "reconnecting…"));
  client.on("error", (e) => setConn("off", "error: " + e.message));
  client.on("close", () => setConn("off", "disconnected"));

  client.on("message", (t, payload) => {
    try {
      const r = JSON.parse(payload.toString());
      applyReport(r);
    } catch (e) {
      console.warn("bad payload on", t, e);
    }
  });
}

$("connectBtn").addEventListener("click", connect);
window.addEventListener("load", connect);   // auto-connect with defaults
</script>
</body>
</html>
